<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Thêm / Sửa sản phẩm</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          crossorigin="anonymous">
</head>
<body class="container mt-4">

<h3 class="mb-3" th:text="${device.id == null ? 'Thêm sản phẩm mới' : 'Chỉnh sửa sản phẩm'}"></h3>

<form th:action="@{${device.id == null ? '/device/save' : '/device/update/' + device.id}}"
      th:object="${device}" method="post" enctype="multipart/form-data">

    <div class="mb-3">
        <label class="form-label">Tên sản phẩm</label>
        <input type="text" th:field="*{deviceName}" class="form-control"/>
        <div th:if="${#fields.hasErrors('deviceName')}" th:errors="*{deviceName}" class="text-danger small"></div>
    </div>

    <div class="mb-3">
        <label class="form-label">Mã sản phẩm</label>
        <input type="text" th:field="*{modelCode}" class="form-control"/>
        <div th:if="${#fields.hasErrors('modelCode')}" th:errors="*{modelCode}" class="text-danger small"></div>
    </div>

    <div class="mb-3">
        <label class="form-label">Giá</label>
        <input type="number" th:field="*{price}" class="form-control"/>
        <div th:if="${#fields.hasErrors('price')}" th:errors="*{price}" class="text-danger small"></div>
    </div>

    <div class="mb-3">
        <label class="form-label">Ngày sản xuất</label>
        <input type="date" th:field="*{manufactureDate}" class="form-control"/>
        <div th:if="${#fields.hasErrors('manufactureDate')}" th:errors="*{manufactureDate}" class="text-danger small"></div>
    </div>

    <div class="mb-3">
        <label class="form-label">Trạng thái</label>
        <select th:field="*{isAvailable}" class="form-select">
            <option th:value="true">Còn hàng</option>
            <option th:value="false">Hết hàng</option>
        </select>
        <div th:if="${#fields.hasErrors('isAvailable')}" th:errors="*{isAvailable}" class="text-danger small"></div>
    </div>

    <!-- Thương hiệu -->
    <div class="mb-3">
        <label class="form-label">Thương hiệu</label>
        <select th:field="*{brandId}" class="form-select">
            <option th:each="bra : ${brand}" th:value="${bra.id}" th:text="${bra.name}"></option>
        </select>
        <div th:if="${#fields.hasErrors('brandId')}" th:errors="*{brandId}" class="text-danger small"></div>
    </div>

    <div class="mb-3">
        <label class="form-label">Ảnh sản phẩm</label>
        <input type="file" name="file" class="form-control"/>
        <div th:if="${device.productImage != null}" class="mt-2">
            <img th:src="@{'/uploads/' + ${device.productImage}}" alt="Ảnh hiện tại" width="120"/>
        </div>
    </div>

    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary" th:text="${device.id == null ? 'Lưu' : 'Cập nhật'}"></button>
        <a th:href="@{/device}" class="btn btn-outline-secondary">Quay lại</a>
    </div>
</form>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
</body>
</html>

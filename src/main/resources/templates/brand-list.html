<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Danh sách thương hiệu</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
          crossorigin="anonymous">
</head>
<body class="container mt-4">

<h2 class="mb-3">Danh sách thương hiệu</h2>
<a class="btn btn-success mb-3" th:href="@{/brand/new}">+ Thêm thương hiệu</a>

<table class="table table-bordered table-striped">
    <thead class="table-light">
    <tr>
        <th>ID</th>
        <th>Tên thương hiệu</th>
        <th>Mô tả</th>
        <th>Hành động</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="bra : ${brands}">
        <td th:text="${bra.id}"></td>
        <td th:text="${bra.name}"></td>
        <td th:text="${bra.description}"></td>
        <td>
            <a th:href="@{'/brand/edit/' + ${bra.id}}" class="btn btn-warning btn-sm">Sửa</a>
            <a th:href="@{'/brand/delete/' + ${bra.id}}"
               class="btn btn-danger btn-sm"
               onclick="return confirm('Bạn có chắc muốn xóa thương hiệu này?')">Xóa</a>
        </td>
    </tr>
    </tbody>
</table>

<div th:if="${brands.size() == 0}" class="mt-2 text-danger">
    Không có thương hiệu nào
</div>

<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"
        crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"
        crossorigin="anonymous"></script>
</body>
</html>
